weights:
  topic_relevance: 0.35
  title_signal: 0.20
  recency: 0.15
  citation_signal: 0.15
  venue_signal: 0.10
  open_access_signal: 0.05
  exclusion_penalty: 0.25

thresholds:
  candidate: 0.35
  to_read: 0.55
  important: 0.75

recency:
  # current_year intentionally NOT pinned: the code uses the actual current year, so
  # recency scoring never silently goes stale. Set current_year only to freeze scoring
  # for a reproducibility snapshot.
  half_life_years: 8
