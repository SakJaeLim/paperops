# Leave user_agent empty to auto-generate "PaperOps/0.2 (mailto:<openalex_mailto>)".
user_agent: ""
# STRONGLY RECOMMENDED: your real email. It puts OpenAlex/Crossref requests in the
# "polite pool" — without it both APIs throttle aggressively (HTTP 429).
openalex_mailto: "your-email@example.com"
# Optional but recommended: unauthenticated Semantic Scholar search is heavily
# rate-limited (429). Get a free key at https://www.semanticscholar.org/product/api
semantic_scholar_api_key: ""

sources:
  arxiv:
    enabled: true
    max_results_per_query: 25
  openalex:
    enabled: true
    max_results_per_query: 25
  crossref:
    enabled: true
    max_results_per_query: 25
  semantic_scholar:
    enabled: true
    max_results_per_query: 25

rate_limits:
  sleep_seconds_between_requests: 1.0

pdf:
  download_enabled: true
  overwrite_existing: false
  min_score_for_download: 0.35
